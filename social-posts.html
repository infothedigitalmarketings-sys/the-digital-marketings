    let currentPostIdx = 0;
    const canvas = document.getElementById('postCanvas');
    const ctx = canvas.getContext('2d');

    // Preload Logo
    const brandLogoImg = new Image();
    brandLogoImg.src = 'assets/logo.svg';
    brandLogoImg.onload = () => {
      renderPostCanvas(currentPostIdx);
    };

    function renderPostsNavList() {
      const navList = document.getElementById('postsNavList');
      navList.innerHTML = tdmBrandPosts.map((p, idx) => `
        <div class="post-nav-item ${idx === currentPostIdx ? 'active' : ''}" onclick="switchPost(${idx})">
          <div class="post-num-badge">${p.id}</div>
          <div class="post-item-info">
            <div class="post-item-category">${p.category}</div>
            <div class="post-item-title">${p.title}</div>
          </div>
        </div>
      `).join('');
    }

    function switchPost(idx) {
      currentPostIdx = idx;
      renderPostsNavList();
      updatePostUI(idx);
      renderPostCanvas(idx);
    }

    function updatePostUI(idx) {
      const post = tdmBrandPosts[idx];
      document.getElementById('currentPostCategory').textContent = post.category;
      document.getElementById('currentPostHeading').textContent = post.headline;
      document.getElementById('postCounterLabel').textContent = `Post ${idx + 1} of 10`;
      document.getElementById('captionTextarea').value = post.caption;
    }

    /* --------------------------------------------------------------------------
       Canvas High-Definition 1080 × 1350 Renderer
       -------------------------------------------------------------------------- */
    function renderPostCanvas(idx) {
      const data = tdmBrandPosts[idx];
      const w = 1080;
      const h = 1350;

      // 1. Dark Cyber Gradient Background
      const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0, '#0C1019');
      bgGrad.addColorStop(0.5, '#07090F');
      bgGrad.addColorStop(1, '#05070A');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // 2. Ambient Neon Lime Glow Orbs
      // Top Right Glow
      const glow1 = ctx.createRadialGradient(w - 120, 180, 20, w - 120, 180, 480);
      glow1.addColorStop(0, 'rgba(210, 250, 21, 0.22)');
      glow1.addColorStop(0.5, 'rgba(210, 250, 21, 0.08)');
      glow1.addColorStop(1, 'transparent');
      ctx.fillStyle = glow1;
      ctx.beginPath();
      ctx.arc(w - 120, 180, 480, 0, Math.PI * 2);
      ctx.fill();

      // Bottom Left Glow
      const glow2 = ctx.createRadialGradient(140, h - 260, 20, 140, h - 260, 460);
      glow2.addColorStop(0, 'rgba(210, 250, 21, 0.18)');
      glow2.addColorStop(0.5, 'rgba(210, 250, 21, 0.06)');
      glow2.addColorStop(1, 'transparent');
      ctx.fillStyle = glow2;
      ctx.beginPath();
      ctx.arc(140, h - 260, 460, 0, Math.PI * 2);
      ctx.fill();

      // 3. Subtle Cyber Matrix Grid
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      const gridGap = 60;
      for (let x = 0; x < w; x += gridGap) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y < h; y += gridGap) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }
      ctx.restore();

      const padX = 70;
      let curY = 70;

      // 4. Header: Official DM Brand Logo (Crisp aspect-ratio preserved)
      if (brandLogoImg.complete && brandLogoImg.naturalWidth > 0) {
        const maxW = 240;
        const maxH = 100;
        const imgAspect = brandLogoImg.width / brandLogoImg.height;
        let drawW = maxW;
        let drawH = drawW / imgAspect;
        if (drawH > maxH) {
          drawH = maxH;
          drawW = drawH * imgAspect;
        }
        ctx.drawImage(brandLogoImg, padX, curY - 10, drawW, drawH);
      } else {
        ctx.fillStyle = '#D2FA15';
        ctx.font = '900 32px "Outfit", sans-serif';
        ctx.fillText('THE DIGITAL MARKETINGS', padX, curY + 40);
      }

      // Top Right Category Pill
      ctx.save();
      const catW = 340;
      const catH = 46;
      const catX = w - padX - catW;
      const catY = curY + 12;

      ctx.fillStyle = 'rgba(210, 250, 21, 0.12)';
      ctx.strokeStyle = '#D2FA15';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(catX, catY, catW, catH, 23);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#D2FA15';
      ctx.font = '800 15px "Outfit", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`●  ${data.badge}`, catX + (catW / 2), catY + (catH / 2));
      ctx.restore();

      curY += 130;

      // 5. Stat Badge (Urgency / Proof)
      ctx.save();
      ctx.font = '800 18px "Outfit", sans-serif';
      ctx.fillStyle = '#D2FA15';
      ctx.textAlign = 'left';
      ctx.fillText(data.statBadge.toUpperCase(), padX, curY);
      ctx.restore();

      curY += 46;

      // 6. Main Bold Headline
      ctx.save();
      ctx.font = '900 52px "Outfit", sans-serif';
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'left';
      const headlineLines = wrapText(ctx, data.headline, w - (padX * 2));
      headlineLines.forEach((line, i) => {
        ctx.fillStyle = i === 0 ? '#D2FA15' : '#FFFFFF';
        ctx.fillText(line, padX, curY);
        curY += 62;
      });
      ctx.restore();

      curY += 10;

      // 7. Sub-headline
      ctx.save();
      ctx.font = '500 22px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = '#94A3B8';
      const subLines = wrapText(ctx, data.subheadline, w - (padX * 2));
      subLines.forEach(line => {
        ctx.fillText(line, padX, curY);
        curY += 32;
      });
      ctx.restore();

      curY += 24;

      // 8. 4 Infographic Feature Cards
      const bullets = [data.bullet1, data.bullet2, data.bullet3, data.bullet4];
      const cardH = 92;
      bullets.forEach((bullet, idx) => {
        drawFeatureCard(ctx, padX, curY, w - (padX * 2), cardH, bullet, idx + 1);
        curY += cardH + 16;
      });

      curY += 14;

      // 9. CTA High-Converting Neon Button
      drawCtaButton(ctx, padX, curY, w - (padX * 2), 76, data.cta);

      // 10. Bottom Verified Footer Contact Bar
      const footY = h - 90;
      ctx.save();
      ctx.fillStyle = 'rgba(12, 16, 24, 0.95)';
      ctx.strokeStyle = 'rgba(210, 250, 21, 0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(padX, footY, w - (padX * 2), 54, 16);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#D2FA15';
      ctx.font = '800 16px "Outfit", sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('📞 +91 9316954389', padX + 24, footY + 27);

      ctx.fillStyle = '#CBD5E1';
      ctx.font = '600 15px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('📍 Ahmedabad, Gujarat, India', w / 2, footY + 27);

      ctx.fillStyle = '#D2FA15';
      ctx.font = '700 15px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('🌐 thedigitalmarketings.com', w - padX - 24, footY + 27);
      ctx.restore();
    }

    function drawFeatureCard(ctx, x, y, w, h, text, index) {
      ctx.save();
      // Glass Dark Card Background
      ctx.fillStyle = 'rgba(18, 23, 34, 0.88)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 16);
      ctx.fill();
      ctx.stroke();

      // Neon Accent Left Bar
      ctx.fillStyle = '#D2FA15';
      ctx.beginPath();
      ctx.roundRect(x, y, 8, h, [16, 0, 0, 16]);
      ctx.fill();

      // Number Badge Circle
      ctx.fillStyle = 'rgba(210, 250, 21, 0.12)';
      ctx.beginPath();
      ctx.arc(x + 46, y + (h / 2), 22, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#D2FA15';
      ctx.font = '800 18px "Outfit", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`0${index}`, x + 46, y + (h / 2));

      // Bullet Text
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = '700 21px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = '#F8FAFC';
      ctx.fillText(text, x + 88, y + (h / 2));

      ctx.restore();
    }

    function drawCtaButton(ctx, x, y, w, h, text) {
      ctx.save();
      ctx.fillStyle = '#D2FA15';
      ctx.shadowColor = 'rgba(210, 250, 21, 0.6)';
      ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 20);
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.font = '900 24px "Outfit", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text.toUpperCase() + ' →', x + (w / 2), y + (h / 2));
      ctx.restore();
    }

    function wrapText(ctx, text, maxWidth) {
      if (!text) return [];
      const words = text.split(' ');
      const lines = [];
      let currentLine = words[0];

      for (let i = 1; i < words.length; i++) {
        const word = words[i];
        const width = ctx.measureText(currentLine + ' ' + word).width;
        if (width < maxWidth) {
          currentLine += ' ' + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);
      return lines;
    }

    // Navigation & Button Event Listeners
    document.getElementById('prevPostBtn').addEventListener('click', () => {
      const newIdx = (currentPostIdx - 1 + tdmBrandPosts.length) % tdmBrandPosts.length;
      switchPost(newIdx);
    });

    document.getElementById('nextPostBtn').addEventListener('click', () => {
      const newIdx = (currentPostIdx + 1) % tdmBrandPosts.length;
      switchPost(newIdx);
    });

    document.getElementById('downloadCurrentPostBtn').addEventListener('click', () => {
      const post = tdmBrandPosts[currentPostIdx];
      const filename = `TDM-InstaPost-${post.id}-${post.title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.png`;
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png', 1.0);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    document.getElementById('copyCaptionBtn').addEventListener('click', () => {
      const textarea = document.getElementById('captionTextarea');
      textarea.select();
      navigator.clipboard.writeText(textarea.value);
      const btn = document.getElementById('copyCaptionBtn');
      btn.textContent = '✓ Copied to Clipboard!';
      setTimeout(() => btn.textContent = '📋 Copy Caption', 2000);
    });

    // Batch Download All 10 Posts
    document.getElementById('downloadBatchAllBtn').addEventListener('click', async () => {
      const btn = document.getElementById('downloadBatchAllBtn');
      btn.textContent = '⏳ Generating 10 Posts...';

      for (let i = 0; i < tdmBrandPosts.length; i++) {
        renderPostCanvas(i);
        await new Promise(r => setTimeout(r, 200));

        const post = tdmBrandPosts[i];
        const filename = `TDM-Post-0${post.id}-${post.title.toLowerCase().replace(/[^a-z0-9]+/g, '-')}.png`;
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png', 1.0);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      renderPostCanvas(currentPostIdx);
      btn.textContent = '✓ All 10 Posts Downloaded!';
      setTimeout(() => btn.textContent = '📦 Download All 10 Posts', 3000);
    });

    // Initial load
    renderPostsNavList();
    updatePostUI(0);
  </script>
